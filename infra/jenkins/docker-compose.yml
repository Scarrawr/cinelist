services:
  jenkins:
    build: .
    container_name: jenkins
    user: root            # classroom/lab only: lets Jenkins use the Docker socket
    restart: unless-stopped
    ports:
      - "8081:8080"       # Jenkins UI at http://localhost:8081
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
