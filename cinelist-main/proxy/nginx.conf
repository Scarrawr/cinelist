# Single public entry point. Routes by path to the right container.
server {
    listen 8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- proxy's own health check ---
    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # --- per-service health checks (used by the Jenkins smoke test) ---
    location = /health/auth   { proxy_pass http://auth-service:3001/health; }
    location = /health/movies { proxy_pass http://movies-api:3002/health; }

    # --- internal login check: asks auth-service whether the session is valid ---
    location = /_auth {
        internal;
        proxy_pass http://auth-service:3001/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # --- app page is only served to logged-in users, others go to /login.html ---
    location = / {
        auth_request /_auth;
        error_page 401 = @to_login;
        proxy_pass http://frontend:8080/index.html;
    }
    location = /index.html {
        auth_request /_auth;
        error_page 401 = @to_login;
        proxy_pass http://frontend:8080/index.html;
    }
    location @to_login {
        return 302 /login.html;
    }

    # --- auth endpoints -> auth-service ---
    location ~ ^/api/(login|logout|register|me)$ {
        proxy_pass http://auth-service:3001;
    }

    # --- every other API call -> movies-api ---
    location /api/ {
        proxy_pass http://movies-api:3002;
    }

    # --- everything else (login.html, script.js, style.css, ...) -> frontend ---
    location / {
        proxy_pass http://frontend:8080;
    }
}
